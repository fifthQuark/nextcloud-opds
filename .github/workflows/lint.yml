name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: find lib appinfo templates -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Validate info.xml against the App Store schema
        run: |
          command -v xmllint >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
          curl -sSfL -o /tmp/info.xsd https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml
