# Builds, signs and publishes a release whenever a tag like v1.0.0 is pushed.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APP_PRIVATE_KEY   content of opds.key (the key whose CSR Nextcloud signed)
#   APP_CERTIFICATE   content of opds.crt (issued by Nextcloud, see PUBLISHING.md)
#   APPSTORE_TOKEN    API token from https://apps.nextcloud.com/account/token
#
# The tag must match the <version> in appinfo/info.xml (v1.2.3 <-> 1.2.3).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Read app id and version
        id: app
        run: |
          APP_ID=$(sed -n 's:.*<id>\(.*\)</id>.*:\1:p' appinfo/info.xml | head -1)
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -1)
          TAG=${GITHUB_REF_NAME#v}
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match info.xml version $VERSION" >&2
            exit 1
          fi
          echo "id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=${APP_ID}-${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Lint PHP
        run: find lib appinfo templates -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Stage release files
        run: |
          mkdir -p build/${{ steps.app.outputs.id }}
          git archive --format=tar HEAD | tar -x -C build/${{ steps.app.outputs.id }}

      - name: Write signing key and certificate
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
        run: |
          umask 077
          printf '%s\n' "$APP_PRIVATE_KEY" > "${RUNNER_TEMP}/app.key"
          printf '%s\n' "$APP_CERTIFICATE" > "${RUNNER_TEMP}/app.crt"
          openssl pkey -in "${RUNNER_TEMP}/app.key" -noout 2>/dev/null || { echo "APP_PRIVATE_KEY is missing or not a valid PEM key" >&2; exit 1; }
          openssl x509 -in "${RUNNER_TEMP}/app.crt" -noout 2>/dev/null || { echo "APP_CERTIFICATE is missing or not a valid PEM certificate" >&2; exit 1; }
          [ "$(openssl pkey -in "${RUNNER_TEMP}/app.key" -pubout)" = "$(openssl x509 -in "${RUNNER_TEMP}/app.crt" -pubkey -noout)" ] || { echo "APP_PRIVATE_KEY does not match APP_CERTIFICATE" >&2; exit 1; }

      - name: Sign app files (occ integrity:sign-app)
        run: scripts/sign-app.sh build/${{ steps.app.outputs.id }} "${RUNNER_TEMP}/app.key" "${RUNNER_TEMP}/app.crt"

      - name: Build tarball and App Store signature
        id: build
        run: |
          tar -czf "build/${{ steps.app.outputs.tarball }}" -C build ${{ steps.app.outputs.id }}
          SIG=$(openssl dgst -sha512 -sign "${RUNNER_TEMP}/app.key" "build/${{ steps.app.outputs.tarball }}" | openssl base64 -A)
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          rm -f "${RUNNER_TEMP}/app.key"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ steps.app.outputs.tarball }}
          generate_release_notes: true

      - name: Publish to the Nextcloud App Store
        # Secrets cannot be used in `if:` directly; APPSTORE_TOKEN comes from the job env.
        if: ${{ env.APPSTORE_TOKEN != '' }}
        env:
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.app.outputs.tarball }}
          SIGNATURE: ${{ steps.build.outputs.signature }}
        run: |
          # GitHub needs a moment before the release asset is downloadable
          for i in $(seq 1 20); do
            curl -sfIL "$DOWNLOAD" >/dev/null && break
            sleep 10
          done
          BODY=$(printf '{"download":"%s","signature":"%s","nightly":false}' "$DOWNLOAD" "$SIGNATURE")
          curl -sf -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token $APPSTORE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          echo "Published ${{ steps.app.outputs.id }} ${{ steps.app.outputs.version }} to the App Store"
